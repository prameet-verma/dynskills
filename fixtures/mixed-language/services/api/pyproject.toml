[tool.poetry]
name = "platform-api"
version = "0.1.0"
description = "Flask API"

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0.3"
sqlalchemy = { version = "^2.0.36", extras = ["asyncio"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
