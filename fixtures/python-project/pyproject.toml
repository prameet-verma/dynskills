[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orders-api"
version = "0.3.0"
description = """
Orders API built with FastAPI.
"""
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",  # ORM
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
