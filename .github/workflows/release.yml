name: Release

# Publishing a GitHub release publishes the same version to npm.
# Authentication uses npm trusted publishing (OIDC): no npm token is stored in the repository,
# and npm attaches a provenance statement linking the package to this workflow run.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: pnpm install --frozen-lockfile
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
      - name: Publish (prepublishOnly runs typecheck, lint, tests and build)
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
